<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kali Linux - Secure Shell Interface</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f0c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 2fr 1fr;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
            font-size: 14px;
        }
        .panel {
            background: #111a13;
            border: 1px solid #00ff6655;
            padding: 12px;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .panel h3 {
            font-size: 12px;
            border-bottom: 1px dashed #00ff6655;
            padding-bottom: 5px;
            margin-bottom: 8px;
            color: #00cc52;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Panel 1: Procesos y logs en streaming */
        .logs {
            font-size: 12px;
            line-height: 1.4;
            color: #00dd55;
            flex-grow: 1;
            overflow: hidden;
        }
        /* Panel 2: Mapa de red visual falso con canvas */
        #networkCanvas {
            width: 100%;
            height: 100%;
            background: #060a07;
        }
        /* Panel 3: Consola interactiva inferior */
        .console-panel {
            grid-column: span 2;
            background: #070c08;
            font-family: 'Courier New', Courier, monospace;
        }
        .prompt {
            color: #ff3333;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h3>System Processes & Packet Sniffer</h3>
        <div class="logs" id="logBox"></div>
    </div>

    <div class="panel">
        <h3>Network Topology Visualizer</h3>
        <canvas id="networkCanvas"></canvas>
    </div>

    <div class="panel console-panel">
        <h3>Active Shell - /opt/exploit/</h3>
        <div><span class="prompt">root@kali:/opt/exploit#</span> <span id="commandText"></span><span class="cursor">█</span></div>
    </div>

    <script>
        // 1. Simulación de Logs de Procesos
        const logBox = document.getElementById('logBox');
        const logMessages = [
            "[+] Initializing intrusion detection system...",
            "[+] Scanning port 443 (HTTPS) - Target: 10.0.0.254",
            "[!] Analyzing data bits (18.4kb/s)...",
            "[+] Firewall bypassed. Attempting root login...",
            "[*] Syncing local DB into cache...",
            "[+] Injecting payload into memory sector 0x7FFF...",
            "[!] Warning: Intrusion counter-measure detected on node 4.",
            "[+] Uploading data packets... [OK]"
        ];

        setInterval(() => {
            let msg = logMessages[Math.floor(Math.random() * logMessages.length)];
            logBox.innerHTML += msg + "<br>";
            if (logBox.childElementCount > 15) {
                logBox.scrollTop = logBox.scrollHeight;
            }
        }, 300);

        // 2. Simulación de Comandos tipeándose solos abajo
        const commands = [
            "./init_payload.sh --target_host 10.0.0.254 --verbose",
            "nmap -A -T4 school_network_sub.local",
            "python3 exploit_cve_2026.py --bypass-auth",
            "airgeddon --interface wlan0mon --net-jam",
            "cat /etc/shadow | grep root"
        ];
        
        let cmdIndex = 0;
        let charIndex = 0;
        const commandText = document.getElementById('commandText');
        
        function typeCommand() {
            let currentCmd = commands[cmdIndex];
            if (charIndex < currentCmd.length) {
                commandText.textContent += currentCmd.charAt(charIndex);
                charIndex++;
                setTimeout(typeCommand, 50);
            } else {
                setTimeout(() => {
                    commandText.textContent = "";
                    charIndex = 0;
                    cmdIndex = (cmdIndex + 1) % commands.length;
                }, 3000);
            }
        }
        setTimeout(typeCommand, 1000);

        // 3. Animación del mapa de red (Canvas)
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth - 24;
            canvas.height = canvas.parentElement.clientHeight - 40;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let nodes = [];
        for(let i=0; i<8; i++) {
            nodes.push({
                x: Math.random() * 250 + 20,
                y: Math.random() * 120 + 20,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8
            });
        }

        function drawNetwork() {
            ctx.fillStyle = "#060a07";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "#00ff6644";
            ctx.lineWidth = 1;

            // Dibujar líneas de conexión entre nodos cercanos
            for(let i=0; i<nodes.length; i++) {
                for(let j=i+1; j<nodes.length; j++) {
                    let dist = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);
                    if(dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Dibujar y mover nodos
            ctx.fillStyle = "#00ff66";
            nodes.forEach(n => {
                n.x += n.vx;
                n.y += n.vy;
                if(n.x < 10 || n.x > canvas.width - 10) n.vx *= -1;
                if(n.y < 10 || n.y > canvas.height - 10) n.vy *= -1;

                ctx.beginPath();
                ctx.arc(n.x, n.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(drawNetwork);
        }
        drawNetwork();
    </script>
</body>
</html>
